<!-- TranscrevAI -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranscrevAI - Transcrição e Diarização Inteligentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v={{ static_hashes['styles.css'] }}">
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-header">
                <div class="soundwave" id="soundwave"></div>
                <span class="logo-text">TranscrevAI</span>
            </div>
            <p class="subtitle">Transcrição e Diarização Inteligentes</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('recording')">
                Gravação ao Vivo
            </div>
            <div class="tab" onclick="switchTab('upload')">
                Upload de Arquivo
            </div>
        </div>

        <!-- Tab de Gravação Ao Vivo -->
        <div id="recording-tab" class="tab-content active">
            <div class="card">
                <div class="format-selector">
                    <label class="format-label">Formato de gravação:</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="audio-format" value="wav" checked>
                            <span>WAV (melhor qualidade)</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="audio-format" value="mp4">
                            <span>MP4 (visualizar com legenda .srt)</span>
                        </label>
                    </div>
                </div>

                <div class="button-row recording-controls">
                    <button class="button button-primary" id="start-live-btn">
                        Iniciar Gravação
                    </button>
                    <button class="button button-warning" id="pause-live-btn" style="display:none">
                        Pausar
                    </button>
                    <button class="button button-primary" id="resume-live-btn" style="display:none">
                        Resumir
                    </button>
                    <button class="button button-danger" id="stop-live-btn" style="display:none">
                        Parar Gravação
                    </button>
                </div>

                <div class="center">
                    <div id="recording-timer" class="timer">00:00</div>
                    <div class="timer-max">(10:00 máx.)</div>
                </div>

                <div class="center mb-2">
                    <div id="live-status" class="status-indicator">Desconectado</div>
                </div>
            </div>
        </div>

        <!-- Tab de Upload -->
        <div id="upload-tab" class="tab-content">
            <div class="card">

                <div class="file-drop-zone" onclick="document.getElementById('file-input').click()">
                    <p><strong>Clique aqui ou arraste um arquivo de áudio</strong></p>
                    <p>Formatos suportados: WAV, MP3, M4A, FLAC, OGG</p>
                    <p class="upload-limits">Tamanho máx. 100MB &nbsp;·&nbsp; Duração máx. 10min</p>
                    <input type="file" id="file-input" class="file-input" accept=".wav,.mp3,.m4a,.flac,.ogg">
                </div>

                <div class="button-row">
                    <button class="button button-primary" id="upload-btn" onclick="processUpload()" disabled>
                        Processar Arquivo
                    </button>
                </div>
            </div>
        </div>

        <!-- Status de Processamento -->
        <div class="status" id="status">
            <h3>Status do Processamento</h3>
            <div class="spinner" id="loading-spinner"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p id="status-text">Aguardando...</p>
        </div>

        <!-- Resultados -->
        <div class="results" id="results">
            <div class="stats-grid" id="stats"></div>

            <div class="button-row">
                <button class="button button-secondary" id="download-audio-btn" style="display: none;">
                    Baixar Áudio
                </button>
                <button class="button button-secondary" id="download-btn" onclick="downloadSRT()" disabled>
                    Baixar Legendas (.srt)
                </button>
            </div>

            <div id="transcription-results"></div>
        </div>
    </div>

    <script>
        const generateMultiPeakWave = (count = 50) => {
            const peakCenters = [0.2, 0.45, 0.75];
            const peakWidths  = [0.15, 0.2, 0.18];
            return Array.from({ length: count }, (_, i) => {
                const x = i / (count - 1);
                let envelope = 0;
                peakCenters.forEach((center, idx) => {
                    const dist      = Math.abs(x - center);
                    const influence = Math.exp(-Math.pow(dist / peakWidths[idx], 2));
                    envelope = Math.max(envelope, influence);
                });
                const sawtooth = (i % 3 === 0) ? 1.0 : (i % 3 === 1 ? 0.4 : 0.7);
                const noise    = 0.8 + Math.random() * 0.4;
                return Math.max(8, Math.min(100, Math.round(envelope * sawtooth * noise * 100)));
            });
        };

        const wave = document.getElementById('soundwave');
        const staticHeights = generateMultiPeakWave();
        const bars = staticHeights.map(h => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = h + '%';
            wave.appendChild(bar);
            return bar;
        });

        let waveRaf = null;
        let waveMode = 'intro';
        let waveT = 0;          // tempo acumulado da animação (não avança quando pausado)
        let waveLast = null;    // timestamp do último frame

        function animateWave(now) {
            if (waveMode === 'stopped') return;

            if (waveLast !== null) waveT += (now - waveLast) / 1000;
            waveLast = now;

            const factor_for = (amp, i) => 0.75 + amp * Math.sin(waveT * 4 + i * 0.5);

            if (waveMode === 'intro') {
                const half = 1.5;
                const amp = waveT < half
                    ? 0.25 * (waveT / half)
                    : 0.25 * (1 - (waveT - half) / half);
                if (waveT >= 3) {
                    waveMode = 'stopped';
                    waveRaf = null;
                    waveLast = null;
                    return;
                }
                bars.forEach((bar, i) => {
                    bar.style.height = (staticHeights[i] * Math.max(0.5, factor_for(amp, i))) + '%';
                });
            } else if (waveMode === 'live') {
                bars.forEach((bar, i) => {
                    bar.style.height = (staticHeights[i] * factor_for(0.25, i)) + '%';
                });
            }

            waveRaf = requestAnimationFrame(animateWave);
        }

        window.startWaveAnim = function() {
            waveMode = 'live';
            waveLast = null; // reseta referência para não somar tempo pausado
            if (waveRaf) cancelAnimationFrame(waveRaf);
            waveRaf = requestAnimationFrame(animateWave);
        };

        window.stopWaveAnim = function() {
            waveMode = 'stopped';
            waveLast = null;
            if (waveRaf) { cancelAnimationFrame(waveRaf); waveRaf = null; }
        };

        // animação intro ao carregar
        waveRaf = requestAnimationFrame(animateWave);
    </script>
    <script src="/static/app.js?v={{ static_hashes['app.js'] }}"></script>
</body>
</html>
