/* ---------- Interactive Sound Wave -> Text ---------- */
/* The visual: a row of bars that breathe like a waveform; as the user
   slides/hovers, the bars settle into clean baselines and lines of
   transcribed text fade up underneath. */

const TRANSCRIPT_LINES = [
  { speaker: "Ana",  text: "Então, sobre o lançamento — quero focar na clareza acima de tudo." },
  { speaker: "Léo",  text: "Concordo. A demo precisa ser legível em três segundos." },
  { speaker: "Ana",  text: "Manda o resumo executivo até sexta, com os marcos do Q3." },
  { speaker: "Léo",  text: "Feito. Já marquei a revisão com o jurídico e o time de produto." },
];

function useTicker(active, speed = 0.06) {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!active) return;
    let raf, last = performance.now();
    const loop = (now) => {
      const dt = (now - last) / 1000; last = now;
      setT(prev => prev + dt * speed * 60);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [active, speed]);
  return t;
}

function WaveToText() {
  // progress: 0 = pure waveform, 1 = pure transcript
  const [progress, setProgress] = useState(0.0);
  const [dragging, setDragging] = useState(false);
  const ticker = useTicker(progress < 0.98);

  const BAR_COUNT = 56;
  const bars = useMemo(() => {
    return Array.from({ length: BAR_COUNT }).map((_, i) => {
      // Pseudo-random but stable amplitude profile (envelope)
      const env = Math.sin((i / BAR_COUNT) * Math.PI) * 0.85 + 0.15;
      const seed = Math.sin(i * 12.9898) * 43758.5453;
      const rand = seed - Math.floor(seed);
      return { env, rand };
    });
  }, []);

  // Animate progress on first view
  const containerRef = useRef(null);
  useEffect(() => {
    const el = containerRef.current; if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          // gentle initial reveal: wave -> text
          let start = performance.now();
          const dur = 2400;
          const tick = (now) => {
            const k = Math.min(1, (now - start) / dur);
            // ease out cubic
            const eased = 1 - Math.pow(1 - k, 3);
            setProgress(eased);
            if (k < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
          io.disconnect();
        }
      });
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <div ref={containerRef} className="w-full">
      <motion.div
        initial={{ opacity: 0, y: 24 }}
        animate={{ opacity: 1, y: 0 }}
        transition={{ duration: 0.9, delay: 0.5, ease: [0.16, 1, 0.3, 1] }}
        className="relative mx-auto w-full max-w-[1040px] rounded-[28px] bg-mist overflow-hidden"
        style={{ boxShadow: "0 1px 0 rgba(0,0,0,0.04), 0 30px 60px -30px rgba(0,0,0,0.18)" }}
      >
        {/* faux app chrome */}
        <div className="flex items-center justify-between px-5 pt-4 pb-2">
          <div className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full bg-black/10" />
            <span className="w-2.5 h-2.5 rounded-full bg-black/10" />
            <span className="w-2.5 h-2.5 rounded-full bg-black/10" />
          </div>
          <div className="text-[11px] tracking-wide text-fog font-medium uppercase">Reunião · 02:14</div>
          <div className="text-[11px] text-fog font-medium">PT-BR</div>
        </div>

        {/* Stage */}
        <div className="relative h-[300px] sm:h-[360px] px-6 sm:px-10">
          {/* WAVEFORM */}
          <div
            className="absolute inset-x-6 sm:inset-x-10 top-1/2 -translate-y-1/2 flex items-center justify-between gap-[2px] sm:gap-1"
            aria-hidden="true"
          >
            {bars.map((b, i) => {
              const barKey = `bar-${i}`;
              // breathing waveform amplitude when progress < 1
              const breathe = Math.sin(ticker * 2 + i * 0.35) * 0.5 + 0.5;
              const waveH = (b.env * (0.5 + breathe * 0.6)) * 120; // px
              // collapse toward a flat thin line as progress -> 1
              const settled = 4;
              const h = waveH * (1 - progress) + settled * progress;
              // bars also collapse opacity slightly so text reads
              const op = 1 - progress * 0.6;
              return (
                <span
                  key={barKey}
                  className="block bg-black rounded-full"
                  style={{
                    width: "3px",
                    height: `${h}px`,
                    opacity: op,
                    transition: dragging ? "none" : "height 80ms linear",
                  }}
                />
              );
            })}
          </div>

          {/* TRANSCRIPT */}
          <div className="absolute inset-x-6 sm:inset-x-10 inset-y-0 flex flex-col justify-center pointer-events-none">
            <div className="space-y-3 sm:space-y-4">
              {TRANSCRIPT_LINES.map((line, i) => {
                // each line appears in a staggered window of progress
                const start = 0.25 + i * 0.16;
                const end = start + 0.18;
                const local = Math.max(0, Math.min(1, (progress - start) / (end - start)));
                return (
                  <div
                    key={`line-${i}`}
                    className="flex items-baseline gap-3 sm:gap-4"
                    style={{
                      opacity: local,
                      transform: `translateY(${(1 - local) * 8}px)`,
                      transition: "opacity 200ms ease, transform 200ms ease",
                    }}
                  >
                    <span className="shrink-0 text-[11px] sm:text-[12px] font-semibold uppercase tracking-wider text-fog w-10">
                      {line.speaker}
                    </span>
                    <span className="text-[15px] sm:text-[17px] leading-snug text-black">
                      {line.text}
                      {i === TRANSCRIPT_LINES.length - 1 && local > 0.9 && <span className="caret" />}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Scrubber */}
        <div className="px-5 sm:px-8 pb-5 pt-2">
          <div className="flex items-center gap-4">
            <button
              onClick={() => setProgress(p => p > 0.5 ? 0 : 1)}
              className="shrink-0 w-9 h-9 rounded-full bg-black text-white grid place-items-center hover:bg-black/85 transition-colors"
              aria-label="Alternar"
            >
              {progress > 0.5 ? (
                <svg viewBox="0 0 14 14" className="w-3 h-3 fill-white"><rect x="3" y="2" width="2.5" height="10"/><rect x="8.5" y="2" width="2.5" height="10"/></svg>
              ) : (
                <svg viewBox="0 0 14 14" className="w-3 h-3 fill-white"><path d="M3 2 L12 7 L3 12 Z"/></svg>
              )}
            </button>
            <div className="flex-1">
              <div className="flex items-center justify-between text-[10px] uppercase tracking-wider text-fog font-medium mb-1.5">
                <span>Áudio</span>
                <span>Texto</span>
              </div>
              <input
                type="range"
                min="0"
                max="1"
                step="0.001"
                value={progress}
                onChange={(e) => setProgress(parseFloat(e.target.value))}
                onPointerDown={() => setDragging(true)}
                onPointerUp={() => setDragging(false)}
                className="w-full appearance-none h-1 bg-black/10 rounded-full outline-none accent-black"
                style={{
                  background: `linear-gradient(to right, #000 ${progress*100}%, rgba(0,0,0,0.1) ${progress*100}%)`
                }}
              />
            </div>
            <div className="hidden sm:block text-[11px] text-fog font-medium tabular-nums w-10 text-right">
              {Math.round(progress * 100)}%
            </div>
          </div>
        </div>
      </motion.div>

      <p className="text-center text-[12px] text-fog mt-4">
        Arraste para ver áudio virar texto. Ao vivo. Em qualquer idioma.
      </p>
    </div>
  );
}
